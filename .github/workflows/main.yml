name: main-release-validate
description: cross-compilation and lints workflow triggered on pushes and pull-requests to the 'main' branch
run-name: ${{ github.actor }} is running ${{ github.workflow }}

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0

jobs:
    lints:
      name: Format & Lint
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Install Rust toolchain
          uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt, clippy

        - name: Rust Cache
          uses: Swatinem/rust-cache@v2
          with:
            key: lint

        - name: Check formatting
          run: cargo fmt --all -- --check

        - name: Run Clippy
          run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    build:
        name: Build & Test (${{ matrix.target }})
        needs: lints
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      BUILD_PROFILE: release
                      BINARY_NAME: eng-sft
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      BUILD_PROFILE: release
                      BINARY_NAME: eng-sft
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      BUILD_PROFILE: release
                      BINARY_NAME: eng-sft.exe
        steps:
          - name: Checkout repository
            uses: actions/checkout@v6

          - name: Install Rust toolchain
            uses: dtolnay/rust-toolchain@stable
            with:
              targets: ${{ matrix.target }}

          - name: Rust Cache
            uses: Swatinem/rust-cache@v2
            with:
              key: ${{ matrix.target }}-${{ matrix.BUILD_PROFILE }}

          - name: Run tests (${{matrix.target}})
            run: cargo test --workspace --target ${{ matrix.target }} --profile ${{ matrix.BUILD_PROFILE }}

          - name: Build release binaries (${{ matrix.target }})
            run: cargo build --workspace --bin ${{ matrix.BINARY_NAME }} --target ${{ matrix.target }} --profile ${{ matrix.BUILD_PROFILE }}
