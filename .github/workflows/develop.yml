name: develop-fast-feedback
description: compilation and lints workflow triggered on pushes and pull-requests to the 'develop' branch
run-name: ${{ github.actor }} is running ${{ github.workflow }}

on:
    push:
        branches: [ "dev" ]
    pull_request:
        branches: [ "dev" ]

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 1

jobs:
    check-and-lint:
        name: Format & Lint & Check
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Install Rust toolchain
          uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt, clippy

        - name: Rust Cache
          uses: Swatinem/rust-cache@v2
          with:
            key: develop-fast-feedback

        - name: Check formatting
          run: cargo fmt --all -- --check

        - name: Fast Compile Check
          run: cargo check --workspace --all-targets --all-features

        - name: Run Clippy
          run: cargo clippy --workspace --all-targets --all-features -- -D warnings

        - name: Run Tests (Debug Mode)
          run: cargo test --workspace
