name: Publish Release

on:
  push:
    tags:
      - "a*-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: eng-sft-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: eng-sft-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: eng-sft-aarch64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release

      - name: Run tests
        run: cargo test --workspace --locked --target ${{ matrix.target }} --profile release

      - name: Build release binary
        run: cargo build --workspace --locked --bin eng-sft --target ${{ matrix.target }} --profile release

      - name: Package release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/eng-sft" package/eng-sft
          cp src/config.json src/config.schema.json package/
          tar -czf "${{ matrix.archive }}" -C package eng-sft config.json config.schema.json

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/eng-sft.exe" "package/eng-sft.exe"
          Copy-Item "src/config.json" "package/config.json"
          Copy-Item "src/config.schema.json" "package/config.schema.json"
          Compress-Archive -Path "package/*" -DestinationPath "${{ matrix.archive }}"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes