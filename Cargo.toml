[package]
name = "eng-sft"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "eng-sft"

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls", "json", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.3"

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
